    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="2.5" cy="2.5" r="1.3" fill="#dc9d34" opacity="0.35"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d2b30" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0d2b30" stop-opacity="0.9"/>
    </linearGradient>
    <clipPath id="tapeClip">
