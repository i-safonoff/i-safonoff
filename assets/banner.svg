    <radialGradient id="glow" cx="50%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#f0c169" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#dc9d34" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#dc9d34" stop-opacity="0"/>
