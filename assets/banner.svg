<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d2b30"/>
      <stop offset="100%" stop-color="#1c6169"/>
    </linearGradient>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="2.5" cy="2.5" r="1.2" fill="#dc9d34" opacity="0.28"/>
    </pattern>
    <pattern id="edgeDots" width="9" height="9" patternUnits="userSpaceOnUse">
      <circle cx="2.2" cy="2.2" r="1.4" fill="#17110c" opacity="0.55"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d2b30" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0d2b30" stop-opacity="0.9"/>
    </linearGradient>
    <clipPath id="ribbonClip">
      <rect x="-60" y="90" width="1020" height="54"/>
    </clipPath>
  </defs>

  <rect width="900" height="220" fill="url(#sky)"/>
  <rect width="900" height="220" fill="url(#dots)"/>
  <rect width="900" height="220" fill="url(#fade)"/>

  <g fill="#12383e">
    <rect x="0"   y="170" width="46" height="50"/>
    <rect x="52"  y="150" width="34" height="70"/>
    <rect x="92"  y="180" width="60" height="40"/>
    <rect x="158" y="140" width="30" height="80"/>
    <rect x="194" y="165" width="50" height="55"/>
    <rect x="250" y="125" width="26" height="95"/>
    <rect x="282" y="170" width="70" height="50"/>
    <rect x="358" y="148" width="34" height="72"/>
    <rect x="398" y="180" width="44" height="40"/>
    <rect x="448" y="132" width="28" height="88"/>
    <rect x="482" y="170" width="60" height="50"/>
    <rect x="548" y="152" width="34" height="68"/>
    <rect x="588" y="178" width="50" height="42"/>
    <rect x="644" y="138" width="28" height="82"/>
    <rect x="678" y="168" width="64" height="52"/>
    <rect x="748" y="146" width="34" height="74"/>
    <rect x="788" y="180" width="52" height="40"/>
    <rect x="846" y="160" width="30" height="60"/>
    <rect x="880" y="178" width="20" height="42"/>
  </g>

  <g fill="#dc9d34" opacity="0.85">
    <rect x="60"  y="165" width="6" height="8"/>
    <rect x="60"  y="180" width="6" height="8"/>
    <rect x="100" y="192" width="6" height="8"/>
    <rect x="165" y="155" width="6" height="8"/>
    <rect x="165" y="170" width="6" height="8"/>
    <rect x="290" y="185" width="6" height="8"/>
    <rect x="455" y="148" width="6" height="8"/>
    <rect x="555" y="168" width="6" height="8"/>
    <rect x="651" y="155" width="6" height="8"/>
    <rect x="755" y="162" width="6" height="8"/>
  </g>

  <!-- hanging hazard balls -->
  <g stroke="#4a3a1e" stroke-width="1.5" fill="none" opacity="0.9">
    <path d="M 60 0 Q 75 25 82 46"/>
    <path d="M 120 0 Q 110 40 108 70"/>
    <path d="M 820 0 Q 805 22 800 42"/>
  </g>
  <g stroke="#17110c" stroke-width="1.2">
    <circle cx="82" cy="54" r="11" fill="#dc9d34"/>
    <path d="M 71 54 A 11 11 0 0 1 93 54" fill="#17110c"/>
    <circle cx="108" cy="80" r="9" fill="#dc9d34"/>
    <path d="M 99 80 A 9 9 0 0 1 117 80" fill="#17110c"/>
    <circle cx="800" cy="50" r="10" fill="#dc9d34"/>
    <path d="M 790 50 A 10 10 0 0 1 810 50" fill="#17110c"/>
  </g>

  <!-- mustard ribbon with typing name / role -->
  <style>
    @keyframes lineOne {
      0%   { opacity: 0; }
      5%   { opacity: 1; }
      42%  { opacity: 1; }
      47%  { opacity: 0; }
      100% { opacity: 0; }
    }
    @keyframes lineTwo {
      0%   { opacity: 0; }
      50%  { opacity: 0; }
      55%  { opacity: 1; }
      92%  { opacity: 1; }
      97%  { opacity: 0; }
      100% { opacity: 0; }
    }
    .line-one { animation: lineOne 10s ease-in-out infinite; }
    .line-two { animation: lineTwo 10s ease-in-out infinite; }
  </style>
  <g transform="rotate(-6 450 117)">
    <g clip-path="url(#ribbonClip)">
      <rect x="-60" y="90" width="1020" height="54" fill="#dc9d34"/>
      <rect x="-60" y="90" width="1020" height="7" fill="url(#edgeDots)"/>
      <rect x="-60" y="137" width="1020" height="7" fill="url(#edgeDots)"/>
    </g>

    <text class="line-one" x="450" y="124" text-anchor="middle" font-family="Arial Black, Arial, sans-serif"
          font-weight="900" font-size="24" letter-spacing="1.5" fill="#17110c">IVAN SAFONOV</text>

    <text class="line-two" x="450" y="124" text-anchor="middle" font-family="Arial Black, Arial, sans-serif"
          font-weight="900" font-size="19" letter-spacing="1" fill="#17110c">PYTHON BACKEND DEVELOPER &#183; ML ENGINEER</text>
  </g>
</svg>
